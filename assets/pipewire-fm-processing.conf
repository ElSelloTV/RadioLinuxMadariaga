# pipewire-fm-processing.conf
# --------------------------------------------------------
# Cadena de procesamiento de audio para la FM (Radio Tuyú), vía el
# módulo nativo de PipeWire `filter-chain` — reemplaza a EasyEffects
# (ver CLAUDE.md, ronda 52): corre DENTRO del propio servidor de
# audio, sin ningún proceso ni ventana por separado, así que no hay
# nada que ocultar ni que se quede "de fondo" en la barra de tareas.
#
# Cadena: Estéreo (StereoTools) -> Ecualizador 8 bandas (Equalizer8Band)
# -> Compresor (Compressor) -> Limitador (Limiter), los cuatro
# plugins de Calf (calf-plugins), con los nombres de control
# CONFIRMADOS contra la instalación real de Santiago (`lv2info`, no
# adivinados).
#
# Pensada para sonar "como una FM": separación estéreo moderada (sin
# arriesgar compatibilidad mono, importante para transmisión),
# corrección de tono con el EQ (arranca en FLAT/transparente — nadie
# puede escuchar tu FM desde acá, así que no se inventó ninguna curva;
# se afina por oído editando este archivo, ver la nota junto al nodo
# "eq" más abajo), compresión tipo "leveling" (nivela temas
# silenciosos contra temas con picos altos al mismo rango, sin sonar
# "bombeado"), y un limitador de seguridad al final contra cualquier
# saturación — nunca deja pasar nada por encima del techo configurado.
#
# ADVERTENCIA — probar SIEMPRE en foreground antes de dejarlo
# autoarrancando (ver instrucciones de despliegue en el chat/CLAUDE.md):
#   pipewire -c /ruta/a/este/archivo.conf
# Un error de sintaxis acá simplemente hace que PipeWire no cree este
# nodo nuevo (no toca nada de lo que ya está sonando) — pero mejor
# verlo en la terminal antes de ponerlo en autoarranque.
# --------------------------------------------------------

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "FM Processing (Radio Tuyu)"
            media.name        = "FM Processing (Radio Tuyu)"

            filter.graph = {
                nodes = [
                    {
                        type   = lv2
                        name   = stereo
                        plugin = "http://calf.sourceforge.net/plugins/StereoTools"
                        control = {
                            # Ancho estéreo — 1.0 = normal, subido un
                            # 15% (moderado a propósito: mucho más
                            # ancho arriesga cancelación de fase y
                            # problemas de compatibilidad mono, algo
                            # sensible en transmisión FM real).
                            slev        = 1.15
                            stereo_base = 0.0
                            mode        = 0
                            balance_in  = 0.0
                            balance_out = 0.0
                            softclip    = 0.0
                            delay       = 0.0
                            sbal        = 0.0
                            mlev        = 1.0
                            mpan        = 0.0
                        }
                    }
                    {
                        type   = lv2
                        name   = eq
                        plugin = "http://calf.sourceforge.net/plugins/Equalizer8Band"
                        control = {
                            # Arranca FLAT (todas las bandas en su
                            # default real, confirmado con lv2info):
                            # level_in/level_out en 1.0 = 0dB, y las 8
                            # bandas con *_active = 0 (apagada) — el
                            # EQ está en la cadena pero no cambia nada
                            # todavía, a propósito. Para afinar por
                            # oído, activar la banda que haga falta
                            # (probar valores de *_active de 1 en
                            # adelante — el rango real 0-5 de Calf no
                            # está confirmado contra documentación
                            # desde acá, así que hay que probarlo en
                            # vivo) y ajustar su *_freq/*_level/*_q:
                            #   hp = pasa-altos (limpiar rumble/graves
                            #        subsónicos, hp_freq default 30Hz)
                            #   lp = pasa-bajos (recortar agudos)
                            #   ls = shelving de graves (ls_freq 100Hz)
                            #   hs = shelving de agudos (hs_freq 5000Hz)
                            #   p1..p4 = 4 bandas paramétricas libres
                            #        (p1 100Hz, p2 500Hz, p3 2000Hz,
                            #        p4 5000Hz por defecto — se pueden
                            #        reubicar en *_freq)
                            # *_level es GANANCIA LINEAL (no dB): 1.0 =
                            # 0dB, >1.0 sube, <1.0 baja (rango real
                            # 0.015625 a 64, confirmado por lv2info).
                            level_in    = 1.0
                            level_out   = 1.0
                            hp_active   = 0.0
                            hp_freq     = 30.0
                            hp_mode     = 1.0
                            hp_q        = 0.707
                            lp_active   = 0.0
                            lp_freq     = 18000.0
                            lp_mode     = 1.0
                            lp_q        = 0.707
                            ls_active   = 0.0
                            ls_level    = 1.0
                            ls_freq     = 100.0
                            ls_q        = 0.707
                            hs_active   = 0.0
                            hs_level    = 1.0
                            hs_freq     = 5000.0
                            hs_q        = 0.707
                            p1_active   = 0.0
                            p1_level    = 1.0
                            p1_freq     = 100.0
                            p1_q        = 1.0
                            p2_active   = 0.0
                            p2_level    = 1.0
                            p2_freq     = 500.0
                            p2_q        = 1.0
                            p3_active   = 0.0
                            p3_level    = 1.0
                            p3_freq     = 2000.0
                            p3_q        = 1.0
                            p4_active   = 0.0
                            p4_level    = 1.0
                            p4_freq     = 5000.0
                            p4_q        = 1.0
                        }
                    }
                    {
                        type   = lv2
                        name   = comp
                        plugin = "http://calf.sourceforge.net/plugins/Compressor"
                        control = {
                            # threshold en escala LINEAL (no dB): 0.1
                            # ~= -20dB. Punto de partida de "leveling"
                            # — agarra la mayoria del contenido, no
                            # solo los picos.
                            threshold    = 0.1
                            ratio        = 3.5
                            # attack/release en milisegundos.
                            attack       = 15
                            release      = 200
                            # makeup en escala LINEAL: 2.0 ~= +6dB —
                            # moderado, para no forzar de mas al
                            # limitador de despues.
                            makeup       = 2.0
                            knee         = 4.0
                            # detection: 0=peak, 1=RMS — RMS suena
                            # mas musical/suave para nivelar, menos
                            # "nervioso" que peak.
                            detection    = 1.0
                            # stereo_link=1: los dos canales se
                            # comprimen IGUAL, para que la imagen
                            # estereo no se corra al comprimir.
                            stereo_link  = 1.0
                            mix          = 1.0
                        }
                    }
                    {
                        type   = lv2
                        name   = lim
                        plugin = "http://calf.sourceforge.net/plugins/Limiter"
                        control = {
                            # limit en escala LINEAL: 0.933 ~= -0.6dB
                            # — techo de seguridad con margen contra
                            # picos entre muestras (inter-sample
                            # peaks), nunca deja pasar saturacion.
                            limit        = 0.933
                            attack       = 3.0
                            release      = 80.0
                            # ASC (Automatic Sustain Control) prendido
                            # — reduce el "bombeo" audible del
                            # limitador en pasajes fuertes sostenidos.
                            asc          = 1.0
                            asc_coeff    = 0.5
                            # oversampling=2: mejor calidad que el
                            # default (1) sin llegar al maximo (4) —
                            # equilibrio pensado para hardware modesto
                            # (Celeron N2820).
                            oversampling = 2.0
                            auto_level   = 1.0
                        }
                    }
                ]
                links = [
                    { output = "stereo:out_l"  input = "eq:in_l"   }
                    { output = "stereo:out_r"  input = "eq:in_r"   }
                    { output = "eq:out_l"      input = "comp:in_l" }
                    { output = "eq:out_r"      input = "comp:in_r" }
                    { output = "comp:out_l"    input = "lim:in_l"  }
                    { output = "comp:out_r"    input = "lim:in_r"  }
                ]
            }

            # "capture" = la entrada de la cadena: un sink virtual
            # nuevo, "fm_processing_input", que hay que elegir como
            # dispositivo de salida en el programa de la radio
            # (Configuración -> Audio -> Salida Master).
            capture.props = {
                node.name         = "fm_processing_input"
                node.description  = "FM Processing (entrada)"
                media.class       = "Audio/Sink"
                audio.channels    = 2
                audio.position    = [ FL FR ]
            }

            # "playback" = la salida de la cadena, ya procesada — tiene
            # que comportarse como un stream de reproducción normal
            # (media.class = "Stream/Output/Audio", confirmado contra
            # la documentación real de PipeWire — "Audio/Source" que se
            # había puesto antes NO sirve para esto: ese class es para
            # algo de lo que OTROS capturan, nunca se conecta solo a
            # nada, por eso el audio nunca llegaba al hardware pese a
            # que target.object apuntaba bien). Con la clase correcta,
            # se conecta al dispositivo indicado en target.object igual
            # que lo haría cualquier reproductor común.
            playback.props = {
                node.name         = "fm_processing_output"
                node.description  = "FM Processing (salida)"
                media.class       = "Stream/Output/Audio"
                audio.channels    = 2
                audio.position    = [ FL FR ]
                # Apunta directo al nombre real del dispositivo, no a
                # "@DEFAULT_SINK@" — evita depender de cuál sea "el
                # default" del sistema en el momento en que arranca
                # PipeWire (podría no ser el hardware real si alguna
                # prueba anterior dejó otra cosa como default).
                #
                # PC definitiva (Santiago, notebook HBTM Series):
                # codificador estéreo físico conectado por USB (chip
                # MV Silicon) — confirmado con `pactl list sinks
                # short` como el sink RUNNING real (el de la PC
                # secundaria de pruebas, alsa_output.pci-0000_00_1b.0,
                # no existe en esta máquina).
                target.object     = "alsa_output.usb-MV-SILICON_MVSilicon_USB_Audio_20190808-00.analog-stereo"
            }
        }
    }
]
